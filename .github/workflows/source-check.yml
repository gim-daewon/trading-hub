name: Source Integrity

# 데이터 소스가 '조용히 절반만' 주고 있지 않은지 4시간마다 확인한다.
#
# 스캔 워크플로에서도 돌지만 그건 하루 3회뿐이다. 실시간 등락률은 장중에 쓰는
# 기능이라 **장중에 깨지면 다음 스캔까지 모른다** — 야후 배치 상한 때문에
# 미국 등락률이 통째로 안 떴을 때도 사용자가 화면을 보고 알려줬다.
#
# 이 워크플로는 스캔을 돌리지 않는다. API를 한 번 부르고 결과만 요약한다 —
# 1분 안에 끝나고 비용이 거의 없다.
on:
  schedule:
    - cron: '5 */4 * * *'   # 4시간마다 (00:05, 04:05, ... UTC)
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      # 소스 점검은 배포된 API를 부르기만 한다. npm ci가 필요 없다
      - name: Source integrity
        run: node scripts/source-check.mjs

      # 캐시 예열.
      #
      # /api/tracking 콜드 경로가 실측 31초다. 주말처럼 며칠 비워두면
      # 월요일 첫 사용자가 타임아웃된 빈 응답을 본다 — 실제로 그렇게 오진했다.
      # 스캔 워크플로는 평일에만 도니 여기서 4시간마다 같이 데운다.
      - name: Warm cache
        continue-on-error: true
        run: |
          BASE=https://trading-hub-nu-orcin.vercel.app
          for m in us kr crypto; do
            for path in "/api/screener?market=$m" "/api/tracking?market=$m"; do
              t=$(curl -s -o /dev/null -w "%{time_total}" --max-time 90 "$BASE$path" || echo "실패")
              echo "예열 $path -> ${t}s"
            done
          done

  # 화면이 **실제로 그려지는지** 진짜 브라우저로 확인한다.
  #
  # 지금까지 점검은 HTTP 200만 봤다. 그런데 이 앱이 죽는 방식은 서버가 200을 주고
  # 브라우저에서 죽는 것이다 — 손익비 NaN이 JSON에서 null이 되어 추적 화면이
  # 통째로 에러 바운더리로 넘어갔는데 /tracking은 계속 200이었다.
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      # 앱 빌드는 필요 없다 — 배포된 화면을 브라우저로 열기만 한다.
      # playwright 버전은 package.json에 고정돼 있어 로컬과 CI가 같은 브라우저를 쓴다
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Render check
        run: node scripts/smoke.mjs

      # 화면을 죽인 원인(숫자 자리에 null)이 응답에 들어 있는지도 같이 본다.
      # 브라우저가 필요 없어 여기 붙여도 비용이 없다
      - name: JSON null check
        if: always()
        run: node scripts/json-nulls.mjs
