name: Source Integrity

# 데이터 소스가 '조용히 절반만' 주고 있지 않은지 4시간마다 확인한다.
#
# 스캔 워크플로에서도 돌지만 그건 하루 3회뿐이다. 실시간 등락률은 장중에 쓰는
# 기능이라 **장중에 깨지면 다음 스캔까지 모른다** — 야후 배치 상한 때문에
# 미국 등락률이 통째로 안 떴을 때도 사용자가 화면을 보고 알려줬다.
#
# 이 워크플로는 스캔을 돌리지 않는다. API를 한 번 부르고 결과만 요약한다 —
# 1분 안에 끝나고 비용이 거의 없다.
on:
  schedule:
    - cron: '5 */4 * * *'   # 4시간마다 (00:05, 04:05, ... UTC)
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      # 소스 점검은 배포된 API를 부르기만 한다. npm ci가 필요 없다
      - name: Source integrity
        run: node scripts/source-check.mjs
