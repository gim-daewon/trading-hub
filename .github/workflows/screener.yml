name: Screener Scan

# 미국 장 마감 후 스캔.
#
# 주의: 예약 시각과 실제 실행 시각이 다르다. 깃허브 예약 워크플로우는 큐 대기가
# 붙어서 실측 2회 모두 116분 늦게 돌았다 (UTC 21:00 예약 -> 22:56 실행).
# 표본 2개뿐이라 이 지연이 일정하다고 믿으면 안 된다 — 깃허브 부하에 따라 변한다.
#
#   cron 20:30 UTC = ET 16:30 (정규장 마감 30분 후)
#   지연 116분 가정 시 실제 실행 ~22:26 UTC = KST 07:26
#
# ET 16:00(마감 정각)까지 당기지 않는 이유: 야후 일봉과 나스닥 스크리너가
# 종가를 확정 반영하기 전이라 반쪽짜리 스냅샷이 저장될 위험이 있다.
# 하루 1회 도는 20일 지표라 30분~1시간 앞당기는 이득보다 손실 위험이 크다.
on:
  schedule:
    - cron: '30 20 * * 1-5'   # UTC 20:30 = ET 16:30 (마감 30분 후)
  workflow_dispatch:          # 수동 실행

# 기존 cron.yml(텔레그램 알림)과는 완전히 별개다. 서로 영향 없음.
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'   # lib/flow.ts 를 직접 import 하려면 24 필요
          cache: npm

      - run: npm ci

      - name: Run scan
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/scan.mjs

      # 죽은 티커 점검. 야후는 상장폐지 종목에도 몇 년 전 시세를 정상값처럼
      # 계속 주기 때문에 사람 눈으로는 못 찾는다. 실제로 419개 중 15개가
      # 고장나 있었고(ANSS·CYBR·HOLX 등 피인수, 삼성/하이닉스 .KQ 오표기)
      # 그중 하나는 섹터 화면에서 "120일 부진 1위"를 차지하고 있었다.
      #
      # 스캔을 막지는 않는다(continue-on-error). 경고만 띄우고 사람이 판단한다.
      - name: 워치리스트 헬스체크
        continue-on-error: true
        run: node scripts/healthcheck.mjs
