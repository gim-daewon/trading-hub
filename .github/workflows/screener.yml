name: Screener Scan

# 시장별 마감 후 스캔. 한 파일에서 세 시장을 돌린다 —
# 파일을 셋으로 나누면 스캔 로직이 바뀔 때마다 세 군데를 고쳐야 한다.
#
# 주의: 예약 시각과 실제 실행 시각이 다르다. 깃허브 예약 워크플로우는 큐 대기가
# 붙어서 실측 2회 모두 116분 늦게 돌았다 (UTC 21:00 예약 -> 22:56 실행).
# 표본 2개뿐이라 이 지연이 일정하다고 믿으면 안 된다 — 깃허브 부하에 따라 변한다.
# 그래서 아래 시각은 전부 '지연이 붙어도 안전한' 쪽으로 잡았다.
#
#   미국  20:30 UTC = ET 16:30 (정규장 마감 30분 후)
#   한국  08:00 UTC = KST 17:00 (마감 15:30 + 종가 확정 16:30 이후)
#         네이버 응답의 closePriceSendTime이 "1630"이라 16:30은 종가 확정과 겹친다
#   크립토 00:10 UTC = KST 09:10 (UTC 자정 일봉 마감 직후)
#         진행 중인 봉은 lib/bars.ts에서 버리므로 이 시각이 안전하다
#
# 한국·미국은 평일만. 크립토는 24/7이라 매일 돈다.
on:
  schedule:
    - cron: '30 20 * * 1-5'   # 미국
    - cron: '0 8 * * 1-5'     # 한국
    - cron: '10 0 * * *'      # 크립토
  workflow_dispatch:
    inputs:
      market:
        description: '스캔할 시장'
        required: true
        default: us
        type: choice
        options: [us, kr, crypto]

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'   # lib/*.ts 를 직접 import 하려면 24 필요
          cache: npm

      - run: npm ci

      # 예약 실행은 cron 문자열로, 수동 실행은 입력값으로 시장을 정한다.
      # 예약인데 매칭이 안 되면 실패시킨다 — 조용히 미국을 스캔하면
      # 한국 스냅샷이 안 쌓이는 걸 몇 주 뒤에나 알아차린다.
      - name: Resolve market
        id: m
        run: |
          case "${{ github.event.schedule }}" in
            "30 20 * * 1-5") M=us ;;
            "0 8 * * 1-5")   M=kr ;;
            "10 0 * * *")    M=crypto ;;
            "")              M="${{ inputs.market }}" ;;
            *) echo "::error::알 수 없는 cron: '${{ github.event.schedule }}'"; exit 1 ;;
          esac
          if [ -z "$M" ]; then echo "::error::MARKET을 정하지 못했다"; exit 1; fi
          echo "market=$M" >> "$GITHUB_OUTPUT"
          echo "스캔 시장: $M"

      - name: Run scan
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          MARKET: ${{ steps.m.outputs.market }}
        run: node --import ./scripts/ts-resolve-hook.mjs scripts/scan.mjs

      # 스캔이 성공해도 앱이 못 읽는 경우가 있다 (스키마 불일치 등).
      # 실패해도 스캔 자체를 되돌리지는 않으므로 continue-on-error다
      - name: Health check
        continue-on-error: true
        run: node scripts/healthcheck.mjs

      # 캐시 예열.
      #
      # 응답은 스냅샷 id로 캐시된다. 새 스캔이 돌면 키가 바뀌어 첫 요청이
      # 전부 다시 계산한다 — 실측 31초였다. 그 비용을 사용자가 내면 안 된다.
      # 스캔 직후 여기서 한 번 불러 채워둔다.
      - name: Warm cache
        continue-on-error: true
        env:
          MARKET: ${{ steps.m.outputs.market }}
        run: |
          BASE=https://trading-hub-nu-orcin.vercel.app
          for path in "/api/screener?market=$MARKET" "/api/tracking?market=$MARKET"; do
            t=$(curl -s -o /dev/null -w "%{time_total}" --max-time 120 "$BASE$path" || echo "실패")
            echo "예열 $path -> ${t}s"
          done
