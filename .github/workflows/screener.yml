name: Screener Scan

# 미국 장 마감 후 스캔. 20:00 UTC = 16:00 ET(정규장 마감) = KST 05:00 익일
# 나스닥 스크리너가 당일 종가를 반영한 뒤 도는 시각으로 잡았다.
on:
  schedule:
    - cron: '0 21 * * 1-5'   # UTC 21:00 = ET 17:00 (마감 1시간 후)
  workflow_dispatch:          # 수동 실행

# 기존 cron.yml(텔레그램 알림)과는 완전히 별개다. 서로 영향 없음.
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'   # lib/flow.ts 를 직접 import 하려면 24 필요
          cache: npm

      - run: npm ci

      - name: Run scan
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/scan.mjs

      # 죽은 티커 점검. 야후는 상장폐지 종목에도 몇 년 전 시세를 정상값처럼
      # 계속 주기 때문에 사람 눈으로는 못 찾는다. 실제로 419개 중 15개가
      # 고장나 있었고(ANSS·CYBR·HOLX 등 피인수, 삼성/하이닉스 .KQ 오표기)
      # 그중 하나는 섹터 화면에서 "120일 부진 1위"를 차지하고 있었다.
      #
      # 스캔을 막지는 않는다(continue-on-error). 경고만 띄우고 사람이 판단한다.
      - name: 워치리스트 헬스체크
        continue-on-error: true
        run: node scripts/healthcheck.mjs
